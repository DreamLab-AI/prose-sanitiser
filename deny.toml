# cargo-deny policy. Checked in CI (see .github/workflows/ci.yml) and locally
# with `cargo deny check`. Licences are an allow-list of permissive terms only:
# this crate is MIT OR Apache-2.0 and must stay publishable under those terms.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Both reach us only through `c2pa` (prose-sanitiser-media), which this crate
# uses to *read* Content Credentials manifests. Neither is reachable from our
# code paths; both are tracked upstream and the ignore is removed when c2pa
# drops the dependency.
ignore = [
    # rsa: Marvin Attack timing side-channel. Only used by c2pa for signature
    # verification of manifests we inspect; we never hold or use an RSA private
    # key, so there is no key to recover.
    { id = "RUSTSEC-2023-0071", reason = "rsa via c2pa; verification-only, no private key material in this process" },
    # proc-macro-error is unmaintained: a compile-time proc-macro dependency of
    # static-iref (via c2pa); no runtime code.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via c2pa -> static-iref; compile-time only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
