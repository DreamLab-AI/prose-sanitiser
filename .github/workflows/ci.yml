# CI: format, lint, test, and a supply-chain gate on every push and PR.
#
# Every job builds with `--all-features`. The optional `external-verify` feature
# in prose-sanitiser-media gates six cfg blocks; without this flag CI never
# compiles them, so they would rot unnoticed. The gated code degrades when a
# tool is absent rather than requiring one, and the tests assert the shape of
# the tool report rather than any tool's presence, so this is safe on a bare
# runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - run: cargo install cargo-deny --locked
      - run: cargo deny check licenses advisories bans sources

  # The declared rust-version in Cargo.toml is a promise: every test binary
  # must still compile on exactly that toolchain, not just on stable. 0.1.0
  # claimed 1.85 while its dependencies needed 1.89; this job stops that.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Toolchain
        run: |
          rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal --no-self-update
          rustup default ${{ steps.msrv.outputs.version }}
      - run: cargo test --workspace --all-features --locked --no-run
