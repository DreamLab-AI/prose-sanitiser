# Release: build prebuilt binaries for every v* tag and attach them to a GitHub
# Release. Only first-party GitHub actions are used (checkout, upload/download-
# artifact); the toolchain comes from the runner's rustup, and the release is
# created with the gh CLI that ships on every hosted runner.
#
# Artefacts per target: prose-sanitiser-<tag>-<target>.tar.gz + .sha256, containing
# the binaries (inspect-text clean-text inspect-image clean-image inspect-file clean-file audit-dir audit-website rewrite-text slop-scan slop-detect sanitise), LICENSE-MIT, LICENSE-APACHE and README.md.
#
# crates.io publication is deliberately NOT done here: it is a manual,
# credentialled step described in RELEASE.md, run after the tag is cut.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and release, e.g. v0.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINS: "inspect-text clean-text inspect-image clean-image inspect-file clean-file audit-dir audit-website rewrite-text slop-scan slop-detect sanitise"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin,        os: macos-15-intel }
          - { target: aarch64-apple-darwin,       os: macos-15 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install toolchain and target
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *linux-musl ]]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          fi

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}" -p prose-sanitiser

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          name="prose-sanitiser-${tag}-${{ matrix.target }}"
          stage="$(mktemp -d)/$name"
          mkdir -p "$stage"
          for b in $BINS; do
            cp "target/${{ matrix.target }}/release/$b" "$stage/"
            strip "$stage/$b" 2>/dev/null || true
          done
          cp LICENSE-MIT LICENSE-APACHE README.md "$stage/"
          mkdir -p dist
          tar -C "$(dirname "$stage")" -czf "dist/$name.tar.gz" "$name"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the packaged binaries
        run: |
          set -euo pipefail
          for b in $BINS; do
            "target/${{ matrix.target }}/release/$b" --help >/dev/null
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          if [ -f CHANGELOG.md ] && grep -q "^## \[$ver\]" CHANGELOG.md; then
            awk -v v="$ver" '$0 ~ "^## \\["v"\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          else
            echo "No CHANGELOG section for $ver; release notes generated by GitHub." > notes.md
          fi

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --notes-file notes.md --verify-tag
          fi
