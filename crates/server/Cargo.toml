[package]
name = "prose-sanitiser-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP service exposing the prose-sanitiser cleaning pipeline."
keywords = ["sanitiser", "provenance", "http", "axum", "service"]
categories = ["web-programming::http-server", "text-processing"]
readme = "README.md"
# Not published: this is the deployment surface, not a reusable library. The
# metadata above is kept complete anyway so the crate is described identically
# to its published siblings in any workspace-wide inventory.
publish = false
autobins = false

[lib]
name = "prose_sanitiser_server"
path = "src/lib.rs"

[[bin]]
name = "prose-sanitiser-server"
path = "src/bin/prose-sanitiser-server.rs"

[dependencies]
prose-sanitiser = { workspace = true }
prose-sanitiser-core = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["time"] }
